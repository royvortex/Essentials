name: Build Pull Request

on:
  push:
    branches:
    - mc/* # MC version updates
    - pr/* # PR rebases
  pull_request:
    branches:
    - 2.x
    - mc/*
    - dev/*
  merge_group:
    types: [checks_requested]

permissions:
  checks: write

jobs:
  build:
    name: Build and upload
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Git repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: 17

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build EssentialsX with Gradle
      run: |
        chmod +x gradlew
        ./gradlew :EssentialsX:assemble -x checkstyleMain --stacktrace

    - name: Archive plugin jar
      uses: actions/upload-artifact@v7
      with:
        name: EssentialsX plugin jar
        path: Essentials/build/libs/EssentialsX-*.jar