name: Essentials
main: com.earth2me.essentials.Essentials
# Note to developers: This next line cannot change, or the automatic versioning system will break.
version: ${full.version}
website: https://essentialsx.net/
description: Provides an essential, core set of commands for Bukkit.
softdepend: [Vault, LuckPerms]
authors: [Zenexer, ementalo, Aelux, Brettflan, KimKandor, snowleo, ceulemans, Xeology, KHobbits, md_5, Iaccidentally, drtshock, vemacs, SupaHam, mdcfe, JRoy, pop4959]
api-version: "1.13"
commands:
  anvil:
    description: Opens up an Anvil.
    usage: /<command>
    aliases: [eanvil]
  deathback:
    description: Teleports you to your location prior to death.
    usage: /<command> [player]
  backup:
    description: Runs the backup if configured.
    usage: /<command>
    aliases: [ebackup]
  balance:
    description: States the current balance of a player.
    usage: /<command> [player]
    aliases: [bal,ebal,ebalance,money,emoney]
  balancetop:
    description: Gets the top balance values.
    usage: /<command> [page]
    aliases: [ebalancetop,baltop,ebaltop]
  beezooka:
    description: Throw an exploding bee at your opponent.
    usage: /<command>
    aliases: [ebeezooka,beecannon,ebeecannon]
  book:
    description: Allows reopening and editing of sealed books.
    usage: /<command> [title|author [name]]
    aliases: [ebook]
  bottom:
    description: Teleport to the lowest block at your current position.
    usage: /<command>
    aliases: [ ebottom ]
  broadcast:
    description: Broadcasts a message to the entire server.
    usage: /<command> <msg>
    aliases: [bc,ebc,bcast,ebcast,ebroadcast,shout,eshout]
  broadcastworld:
    description: Broadcasts a message to a world.
    usage: /<command> <world> <msg>
    aliases: [bcw,ebcw,bcastw,ebcastw,ebroadcastworld,shoutworld,eshoutworld]
  cartographytable:
    description: Opens up a cartography table.
    usage: /<command>
    aliases: [ecartographytable, carttable, ecarttable]
  clearinventory:
    description: Clear all items in your inventory.
    usage: /<command> [player|*] [item[:<data>]|*|**] [amount]
    aliases: [ci,eci,clean,eclean,clear,eclear,clearinvent,eclearinvent,eclearinventory]
  clearinventoryconfirmtoggle:
    description: Toggles whether you are prompted to confirm inventory clears.
    usage: /<command>
    aliases: [eclearinventoryconfirmtoggle, clearinventoryconfirmoff, eclearinventoryconfirmoff, clearconfirmoff, eclearconfirmoff, clearconfirmon, eclearconfirmon, clearconfirm, eclearconfirm]
  condense:
    description: Condenses items into a more compact blocks.
    usage: /<command> [itemname]
    aliases: [econdense,compact,ecompact,blocks,eblocks,toblocks,etoblocks]
  compass:
    description: Describes your current bearing.
    usage: /<command>
    aliases: [ecompass,direction,edirection]
  customtext:
    description: Allows you to create custom text commands.
    usage: /<alias> - Define in bukkit.yml
  delhome:
    description: Removes a home.
    usage: /<command> [player:]<name>
    aliases: [edelhome,remhome,eremhome,rmhome,ermhome]
  delwarp:
    description: Deletes the specified warp.
    usage: /<command> <warp>
    aliases: [edelwarp,remwarp,eremwarp,rmwarp,ermwarp]
  depth:
    description: States current depth, relative to sea level.
    usage: /<command>
    aliases: [edepth,height,eheight]
  disposal:
    description: Opens a portable disposal menu.
    usage: /<command>
    aliases: [edisposal,trash,etrash]
  eco:
    description: Manages the server economy.
    usage: /<command> <give|take|set|reset> <player> <amount>
    aliases: [eeco,economy,eeconomy]
  enchant:
    description: Enchants the item the user is holding.
    usage: /<command> <enchantmentname> [level]
    aliases: [eenchant,enchantment,eenchantment]
  enderchest:
    description: Lets you see inside an enderchest.
    usage: /<command> [player]
    aliases: [echest,eechest,eenderchest,endersee,eendersee,ec,eec]
  essentials:
    description: Reloads essentials.
    usage: /<command>
    aliases: [eessentials, ess, eess, essversion]
  exp:
    description: Give, set, reset, or look at a players experience.
    usage: /<command> [reset|show|set|give] [playername [amount]]
    aliases: [eexp,xp]
  feed:
    description: Satisfy the hunger.
    usage: /<command> [player]
    aliases: [eat,eeat,efeed]
  fly:
    description: Take off, and soar!
    usage: /<command> [player] [on|off]
    aliases: [efly]
  gamemode:
    description: Change player gamemode.
    usage: /<command> <survival|creative|adventure|spectator> [player]
    aliases: [adventure,eadventure,adventuremode,eadventuremode,creative,ecreative,eecreative,creativemode,ecreativemode,egamemode,gm,egm,gma,egma,gmc,egmc,gms,egms,gmt,egmt,survival,esurvival,survivalmode,esurvivalmode,gmsp,sp,egmsp,spec,spectator]
  gc:
    description: Reports memory, uptime and tick info.
    usage: /<command>
    aliases: [lag,elag,egc,mem,emem,memory,ememory,uptime,euptime,tps,etps,entities,eentities]
  give:
    description: Give a player an item.
    usage: /<command> <player> <item|numeric> [amount [itemmeta...]]
    aliases: [egive]
  god:
    description: Enables your godly powers.
    usage: /<command> [player] [on|off]
    aliases: [egod,godmode,egodmode,tgm,etgm]
  grindstone:
    description: Opens up a grindstone.
    usage: /<command>
    aliases: [egrindstone]
  hat:
    description: Get some cool new headgear.
    usage: /<command> [remove]
    aliases: [ehat,head,ehead]
  heal:
    description: Heals you or the given player.
    usage: /<command> [player]
    aliases: [eheal]
  help:
    description: Views a list of available commands.
    usage: /<command> [search term] [page]
    aliases: [ehelp]
  helpop:
    description: Message online admins.
    usage: /<command> <message>
    aliases: [ac,eac,amsg,eamsg,ehelpop]
  home:
    description: Teleport to your home.
    usage: /<command> [player:][name]
    aliases: [ehome,homes,ehomes]
  ignore:
    description: Ignore or unignore other players.
    usage: /<command> <player>
    aliases: [eignore,unignore,eunignore,delignore,edelignore,remignore,eremignore,rmignore,ermignore]
  info:
    description: Shows information set by the server owner.
    usage: /<command> [chapter] [page]
    aliases: [about,eabout,ifo,eifo,einfo,inform,einform,news,enews]
  kill:
    description: Kills specified player.
    usage: /<command> <player>
    aliases: [ekill]
  list:
    description: List all online players.
    usage: /<command> [group]
    aliases: [elist,online,eonline,playerlist,eplayerlist,plist,eplist,who,ewho]
  loom:
    description: Opens up a loom.
    usage: /<command>
    aliases: [eloom]
  me:
    description: Describes an action in the context of the player.
    usage: /<command> <description>
    aliases: [action,eaction,describe,edescribe,eme]
  more:
    description: Fills the item stack in hand to specified amount, or to maximum size if none is specified.
    usage: /<command> [amount]
    aliases: [emore]
  motd:
    description: Views the Message Of The Day.
    usage: /<command> [chapter] [page]
    aliases: [emotd]
  msg:
    description: Sends a private message to the specified player.
    usage: /<command> <to> <message>
    aliases: [w,m,t,pm,emsg,epm,tell,etell,whisper,ewhisper]
  msgtoggle:
    description: Blocks receiving all private messages.
    usage: /<command> [player] [on|off]
    aliases: [emsgtoggle]
  near:
    description: Lists the players near by or around a player.
    usage: /<command> [playername] [radius]
    aliases: [enear,nearby,enearby]
  nick:
    description: Change your nickname or that of another player.
    usage: /<command> [player] <nickname|off>
    aliases: [enick,nickname,enickname]
  nuke:
    description: May death rain upon them.
    usage: /<command> [player]
    aliases: [enuke]
  tpoffline:
    description: Teleport to a player's last known logout location
    usage: /<command> <player>
    aliases: [otp, offlinetp, tpoff, tpoffline, etpoffline]
  pay:
    description: Pays another player from your balance.
    usage: /<command> <player> <amount>
    aliases: [epay]
  paytoggle:
    description: Toggles whether you are accepting payments.
    usage: /<command> [player]
    aliases: [epaytoggle, payoff, epayoff, payon, epayon]
  payconfirmtoggle:
    description: Toggles whether you are prompted to confirm payments.
    usage: /<command>
    aliases: [epayconfirmtoggle, payconfirmoff, epayconfirmoff, payconfirmon, epayconfirmon, payconfirm, epayconfirm]
  potion:
    description: Adds custom potion effects to a potion.
    usage: /<command> <clear|apply|effect:<effect> power:<power> duration:<duration>>
    aliases: [epotion,elixer,eelixer]
  ptime:
    description: Adjust player's client time. Add @ prefix to fix.
    usage: /<command> [list|reset|day|night|dawn|17:30|4pm|4000ticks] [player|*]
    aliases: [playertime,eplayertime,eptime]
  pweather:
    description: Adjust a player's weather
    usage: /<command> [list|reset|storm|sun|clear] [player|*]
    aliases: [playerweather,eplayerweather,epweather]
  r:
    description: Quickly reply to the last player to message you.
    usage: /<command> <message>
    aliases: [er,reply,ereply]
  rtoggle:
    description: Change whether the recipient of the reply is last recipient or last sender
    usage: /<command> [player] [on|off]
    aliases: [ertoggle, replytoggle, ereplytoggle]
  realname:
    description: Displays the username of a user based on nick.
    usage: /<command> <nickname>
    aliases: [erealname]
  recipe:
    description: Displays how to craft items.
    usage: /<command> <item> [number]
    aliases: [formula,eformula,method,emethod,erecipe,recipes,erecipes]
  remove:
    description: Removes entities in your world.
    usage: /<command> <all|tamed|named|drops|arrows|boats|minecarts|xp|paintings|itemframes|endercrystals|monsters|animals|ambient|mobs|[mobType]> [radius|world]
    aliases: [eremove,butcher,ebutcher,killall,ekillall,mobkill,emobkill]
  renamehome:
    description: Renames a home.
    usage: /<command> <[player:]name> <new name>
    aliases: [erenamehome]
  repair:
    description: Repairs the durability of one or all items.
    usage: /<command> [hand|all]
    aliases: [fix,efix,erepair]
  sethome:
    description: Set your home to your current location.
    usage: /<command> [[player:]name]
    aliases: [esethome,createhome,ecreatehome]
  setwarp:
    description: Creates a new warp.
    usage: /<command> <warp>
    aliases: [createwarp,ecreatewarp,esetwarp]
  smithingtable:
    description: Opens up a smithing table.
    usage: /<command>
    aliases: [esmithingtable, smithtable, esmithtable]
  socialspy:
    description: Toggles if you can see msg/mail commands in chat.
    usage: /<command> [player] [on|off]
    aliases: [esocialspy]
  spawnmob:
    description: Spawns a mob.
    usage: /<command> <mob>[:data][,<mount>[:data]] [amount] [player]
    aliases: [mob,emob,spawnentity,espawnentity,espawnmob]
  speed:
    description: Change your speed limits.
    usage: /<command> [type] <speed> [player]
    aliases: [flyspeed,eflyspeed,fspeed,efspeed,espeed,walkspeed,ewalkspeed,wspeed,ewspeed]
  stonecutter:
    description: Opens up a stonecutter.
    usage: /<command>
    aliases: [estonecutter]
  sudo:
    description: Make another user perform a command.
    usage: /<command> <player> <command [args]>
    aliases: [esudo]
  suicide:
    description: Causes you to perish.
    usage: /<command>
    aliases: [esuicide]
  thunder:
    description: Enable/disable thunder.
    usage: /<command> <true/false> [duration]
    aliases: [ethunder]
  time:
    description: Display/Change the world time. Defaults to current world.
    usage: /<command> [set|add] [day|night|dawn|17:30|4pm|4000ticks] [worldname|all]
    aliases: [day,eday,night,enight,etime]
  top:
    description: Teleport to the highest block at your current position.
    usage: /<command>
    aliases: [etop]
  tp:
    description: Teleport to a player.
    usage: /<command> <player> [otherplayer]
    aliases: [tele,etele,teleport,eteleport,etp,tp2p,etp2p]
  tpa:
    description: Request to teleport to the specified player.
    usage: /<command> <player>
    aliases: [call,ecall,etpa,tpask,etpask]
  tpaccept:
    description: Accepts teleport requests.
    usage: /<command> [player|*]
    aliases: [etpaccept,tpyes,etpyes]
  tpahere:
    description: Request that the specified player teleport to you.
    usage: /<command> <player>
    aliases: [etpahere]
  tpall:
    description: Teleport all online players to another player.
    usage: /<command> [player]
    aliases: [etpall]
  tpauto:
    description: Automatically accept teleportation requests.
    usage: /<command> [player]
    aliases: [etpauto]
  tpacancel:
    description: Cancel all outstanding teleport requests. Specify [player] to cancel requests with them.
    usage: /<command> [player]
    aliases: [etpacancel]
  tpdeny:
    description: Rejects teleport requests.
    usage: /<command> [player|*]
    aliases: [etpdeny,tpno,etpno]
  tphere:
    description: Teleport a player to you.
    usage: /<command> <player>
    aliases: [s,etphere]
  tppos:
    description: Teleport to coordinates.
    usage: /<command> <x> <y> <z> [yaw] [pitch] [world]
    aliases: [etppos]
  tptoggle:
    description: Blocks all forms of teleportation.
    usage: /<command> [player] [on|off]
    aliases: [etptoggle]
  vanish:
    description: Hide yourself from other players.
    usage: /<command> [player] [on|off]
    aliases: [v,ev,evanish]
  warp:
    description: List all warps or warp to the specified location.
    usage: /<command> <pagenumber|warp> [player]
    aliases: [ewarp,warps,ewarps]
  warpinfo:
    description: Finds location information for a specified warp.
    usage: /<command> <warp>
    aliases: [ewarpinfo]
  weather:
    description: Sets the weather.
    usage: /<command> <storm/sun> [duration]
    aliases: [rain,erain,sky,esky,storm,estorm,sun,esun,eweather]
  workbench:
    description: Opens up a workbench.
    usage: /<command>
    aliases: [craft,ecraft,wb,ewb,wbench,ewbench,eworkbench]

permissions:
  essentials.*:
    default: op
    description: Give players with op everything by default
    children:
      essentials.gamemode.*: true
  essentials.deathback:
    description: Allows access to the /deathback command
  essentials.deathback.others:
    description: Allows access to the /deathback command for other players
  essentials.deathback.ondeath:
    default: false
    description: Players with this permission will have back location stored during death
  essentials.deathback.onteleport:
    default: true
    description: Players with this permission will have back location stored during any teleportation
  essentials.deathback.into.<world>:
    description: Allows the player to use the /deathback command to travel to a specific world
  essentials.backup:
    description: Allows access to the /backup command
  essentials.balance:
    description: Allows access to the /balance command
  essentials.balance.others:
    description: Allows view other players balance with the /balance command
  essentials.balancetop:
    description: Allows access to the /balancetop command
  essentials.balancetop.force:
    description: Allows access to force refresh the balancetop list
  essentials.balancetop.exclude:
    default: false
    description: Players with this permission are excluded from the balancetop
  essentials.book:
    description: Allows access to the /book command
  essentials.book.author:
    description: Allows access to edit book authors with the /book command
  essentials.book.others:
    description: Allows access to edit other players books with the /book command
  essentials.book.title:
    description: Allows access to edit book titles with the /book command
  essentials.bottom:
    description: Allows access to the /bottom command
  essentials.broadcast:
    description: Allows access to the /broadcast command
  essentials.broadcastworld:
    description: Allows access to the /broadcastworld command
  essentials.chat.ignoreexempt:
    default: false
    description: Someone with this permission will not be ignored, even if they are on another persons ignore list
  essentials.chat.spy:
    description: Allows the bearers to see all local chat messages, regardless of their proximity to the sender
  essentials.chat.spy.exempt:
    description: Allows the bearer to be exempt from the local chat spy permission
  essentials.clearinventory:
    description: Allows access to the /clearinventory command
  essentials.clearinventory.all:
    description: Allows access to clear the inventory of all players with the /clearinventory command
  essentials.clearinventory.others:
    description: Allows access to clear the inventory of other players with the /clearinventory command
  essentials.clearinventoryconfirmtoggle:
    description: Allows access to the /clearinventoryconfirmtoggle command
  essentials.commandcooldowns.bypass:
    description: Allows the bypassing of all command cooldowns
  essentials.commandcooldowns.bypass.<commandname>:
    description: Allows the bypassing of the cooldown for a specific command
  essentials.compass:
    description: Allows access to the /compass command
  essentials.condense:
    description: Allows access to the /condense command
  essentials.customtext:
    description: Allows access to the /customtext command and all aliases
  essentials.delwarp:
    description: Allows access to the /delwarp command
  essentials.depth:
    description: Allows access to the /depth command
  essentials.disposal:
    description: Allows access to the /disposal command
  essentials.eco:
    description: Allows access to the /eco command
  essentials.eco.loan:
    description: Allows the bearer to possess a negative balance
  essentials.enchant:
    description: Allows access to the /enchant command
  essentials.enchantments.allowunsafe:
    description: Allows the bearer to enchant items with unsafe enchantments
  essentials.enchantments.<enchantment>:
    description: Allows the bearer to use a specific enchantment with the /enchant command
  essentials.enderchest:
    description: Allows access to the /enderchest command
  essentials.enderchest.modify:
    description: Allows the bearer to modify other players enderchests
  essentials.enderchest.others:
    description: Allows access to the /enderchest command for other players
  essentials.essentials:
    description: Allows access to the /essentials command
  essentials.updatecheck:
    description: The bearer will be notified of updates to EssentialsX
  essentials.exp:
    description: Allows access to the /exp command
  essentials.exp.give:
    description: Allows the bearer to give experience to themselves
  essentials.exp.give.others:
    description: Allows the bearer to give experience to other players
  essentials.exp.others:
    description: Allows the bearer to view other players experience
  essentials.exp.set:
    description: Allows the bearer to set experience for themselves
  essentials.exp.set.others:
    description: Allows the bearer to set experience for other players
  essentials.feed:
    description: Allows access to the /feed command
  essentials.feed.others:
    description: Allows access to the /feed command for other players
  essentials.flap:
  essentials.fly:
    description: Allows access to the /fly command
  essentials.fly.safelogin:
    description: Bearers of this permission will be put into fly mode if they log in while in the air
  essentials.fly.others:
    description: Allows access to the /fly command for other players
  essentials.gamemode:
    description: Allows access to the /gamemode command
  essentials.gamemode.all:
    description: Allows access to all gamemodes with the /gamemode command
  essentials.gamemode.others:
    description: Allows access to the /gamemode command for other players
  essentials.gamemode.survival:
    description: Allows access to the survival gamemode with the /gamemode command
  essentials.gamemode.creative:
    description: Allows access to the creative gamemode with the /gamemode command
  essentials.gamemode.adventure:
    description: Allows access to the adventure gamemode with the /gamemode command
  essentials.gamemode.spectator:
    description: Allows access to the spectator gamemode with the /gamemode command
  essentials.gamemode.*:
    description: Allows access to all gamemodes with the /gamemode command
    default: op
    children:
      essentials.gamemode: true
      essentials.gamemode.others: true
      essentials.gamemode.all: true
  essentials.gc:
    description: Allows access to the /gc command
  essentials.give:
    description: Allows access to the /give command
  essentials.give.item-all:
    description: Allows access to the /give command for all items when permission-based-item-spawn is enabled
  essentials.give.item-<item-name>:
    description: Allows access to the /give command for a specific item when permission-based-item-spawn is enabled
  essentials.god:
    description: Allows access to the /god command
  essentials.god.others:
    description: Allows access to the /god command for other players
  essentials.god.pvp:
    description: Allows the bearer to attack players while in god mode
  essentials.hat:
    description: Allows access to the /hat command
  essentials.hat.prevent-type.<item-name>:
    description: Prevents the player from using the /hat command with the specified item
  essentials.hat.ignore-binding:
    description: Allows the bearer to use the /hat command when they have equipped an item with curse of binding
  essentials.heal:
    description: Allows access to the /heal command
  essentials.heal.others:
    description: Allows access to the /heal command for other players
  essentials.help:
    description: Allows access to the /help command
  essentials.help.<plugin-name>:
    description: Allows access to the /help command for a specific plugin
  essentials.helpop:
    description: Allows access to the /helpop command
  essentials.helpop.receive:
    description: Allows the bearer to receive helpop messages
  essentials.kill:
    description: Allows access to the /kill command
  essentials.kill.exempt:
    description: Prevents the player from being killed by /kill
  essentials.kill.force:
    description: Allows the bearer to be killed by /kill even if their death is canceled
  essentials.suicide:
    description: Allows access to the /suicide command for multiple players
  essentials.home:
    description: Allows access to the /home command
  essentials.home.compass:
    default: false
    description: Point the player's compass at their first home. compass-towards-home-perm needs to be enabled in the configuration.
  essentials.home.others:
    description: Allows access to teleport to other players homes with the /home command
  essentials.home.bed:
    description: Allows access to the /home command for beds
  essentials.ignore:
    description: Allows access to the /ignore command
  essentials.info:
    description: Allows access to the /info command
  essentials.itemspawn.exempt:
    description: Allows the bearer to spawn items in the item blacklist
  essentials.itemspawn.meta-chapter-<chapter>:
    description: Allows the bearer to spawn specific books only, from book.txt. with the /give command.
  essentials.itemspawn.meta-author:
    description: Allows the bearer to spawn items with author metadata
  essentials.itemspawn.meta-book:
    description: Allows the bearer to spawn items with pre-filled content from book.txt
  essentials.itemspawn.meta-firework:
    description: Allows the bearer to spawn items with firework metadata
  essentials.itemspawn.meta-head:
    description: Allows the bearer to spawn items with head metadata
  essentials.itemspawn.meta-lore:
    description: Allows the bearer to spawn items with lore metadata
  essentials.itemspawn.meta-title:
    description: Allows the bearer to spawn items with title metadata
  essentials.keepxp:
    default: false
    description: Allows the user to keep their exp on death, instead of dropping it.
  essentials.joinfullserver:
    description: Allows the to join the server even if it is full
  essentials.whitelist.bypass:
    description: Allows a player to join the server even if they are not whitelisted.
  essentials.beezooka:
